name: RadioBee stream reachability report

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: all
        options: [all, kanyakumari, srilanka-tamil, trivandrum-tamil, chennai]
      mode:
        type: choice
        default: quick
        options: [quick, deep]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run audit:streams -- --scope=${{ inputs.scope }} --mode=${{ inputs.mode }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiobee-stream-health
          path: reports/stream-audit.*
          if-no-files-found: warn
          retention-days: 30
