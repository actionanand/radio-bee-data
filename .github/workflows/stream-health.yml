name: RadioBee stream reachability report

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run check:streams
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiobee-stream-health
          path: reports/stream-health.json
          if-no-files-found: warn
          retention-days: 30
