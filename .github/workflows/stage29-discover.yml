name: Research — Discover TamilRadios station playback URLs
on:
  push:
    branches:
      - feature/29-tamilradios-verified-stream-expansion
    paths:
      - docs/stage29/target-pages.json
      - scripts/stage29-discover.py
      - .github/workflows/stage29-discover.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract public station player URLs
        run: python3 scripts/stage29-discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage29-discovery
          path: docs/stage29/discovery-result.json
          retention-days: 7
          if-no-files-found: ignore
