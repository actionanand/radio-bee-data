name: Research — Probe Tamil and English news HLS audio
on:
  push:
    branches:
      - feature/30-tamil-tv-news-audio
    paths:
      - docs/stage31/news-candidates.json
      - scripts/stage31-news-probe.py
      - .github/workflows/stage31-news-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Decode audio from published TV news streams
        run: python3 scripts/stage31-news-probe.py
