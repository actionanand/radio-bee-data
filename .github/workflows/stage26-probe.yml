name: Research — Probe Indian language radio candidates
on:
  push:
    branches:
      - feature/26-indian-languages-playable-expansion
    paths:
      - docs/stage26/candidates.json
      - scripts/stage26-probe.py
      - .github/workflows/stage26-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check audio decoding (non-publishing)
        run: python3 scripts/stage26-probe.py
