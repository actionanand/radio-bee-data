name: Research — Identify Tamil news TV audio tracks
on:
  push:
    branches:
      - feature/29-tamilradios-verified-stream-expansion
    paths:
      - docs/stage29/news-video-candidates.json
      - scripts/stage29-news-probe.py
      - .github/workflows/stage29-news-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Determine broadcaster video/audio codecs and decode audio
        run: python3 scripts/stage29-news-probe.py
