name: Research — Check Tamil stream audio decodes
on:
  push:
    branches:
      - feature/29-tamilradios-verified-stream-expansion
    paths:
      - docs/stage29/audio-candidates.json
      - scripts/stage29-probe.py
      - .github/workflows/stage29-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Probe direct audio streams
        run: python3 scripts/stage29-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage29-audio-probe
          path: docs/stage29/audio-probe-results.json
          retention-days: 7
          if-no-files-found: ignore
